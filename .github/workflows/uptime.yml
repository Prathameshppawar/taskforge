name: Uptime checks

# Vercel Cron runs at most once a day on the hobby plan, which is no use for
# uptime, so GitHub's scheduler calls TaskForge every five minutes instead.
# TaskForge only checks monitors whose own interval has elapsed.
#
# Needs two repository secrets:
#   TASKFORGE_URL   the production base URL, e.g. https://taskforge.example.com
#   CRON_SECRET     the same value as the deployment's CRON_SECRET
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run due monitors
        env:
          TASKFORGE_URL: ${{ secrets.TASKFORGE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$TASKFORGE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "TASKFORGE_URL or CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$TASKFORGE_URL/api/cron/monitors"
